<!doctype html>

    <meta charset="utf-8">

    <title>BarreNotes Posts (Private)</title>

    <link rel="stylesheet" href="../../styles.base.css">
    <link rel="stylesheet" href="../../styles.layout.css">
    <link rel="stylesheet" href="../../styles.components.css">

    <style>
      /* Private page: keep layout self-contained and show images at natural size. */
      .private-wrap {
        padding-block: clamp(24px, 4vw, 56px);
      }

      .private-header {
        display: grid;
        gap: 10px;
        margin-bottom: clamp(18px, 3vw, 28px);
      }

      .private-header h1 {
        margin: 0;
      }

      .private-header p {
        margin: 0;
        max-width: 70ch;
        opacity: 0.9;
      }

      /* Two-column layout:
         - Fill down the left column first, then the right (implemented via JS splitting into 2 lists).
         - No row alignment required.
         Images are scaled to 33% by default, then constrained to the column width (no horizontal scrolling). */
      .post-columns {
        display: grid;
        grid-template-columns: 1fr;
        gap: clamp(14px, 2.2vw, 22px);
      }

      @media (min-width: 900px) {
        .post-columns {
          grid-template-columns: 1fr 1fr;
        }
      }

      .post-col {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 2.2vw, 22px);
      }

      .post-card {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        max-width: min(100%, 1200px);
        overflow: hidden;
      }

      .post-card img {
        display: block;
        /* Default: let the image pick its own size.
           JS below sets explicit width/height to 33% of intrinsic size for a consistent layout. */
        width: auto;
        height: auto;
        max-width: 100%;
      }

      @media (prefers-reduced-motion: reduce) {
        .post-card {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>

    <script>
      // Scale screenshots to 33% of their intrinsic size.
      // Images are also constrained to their column width via CSS (max-width: 100%), preventing horizontal scrolling.
      (function () {
        const SCALE = 0.33;

        function applyScale(img) {
          if (!img.naturalWidth || !img.naturalHeight) return;
          img.width = Math.max(1, Math.round(img.naturalWidth * SCALE));
          img.height = Math.max(1, Math.round(img.naturalHeight * SCALE));
        }

        document.querySelectorAll('.post-card img').forEach((img) => {
          if (img.complete) {
            applyScale(img);
          } else {
            img.addEventListener('load', () => applyScale(img), { once: true });
          }
        });

        // Sort tiles by post date (newest → oldest). Dates are extracted from the screenshot content
        // and stored in each <li data-post-date="YYYY-MM-DD">.
        // Then: split into two columns by count (fill down left column first, then right).
        const leftCol = document.querySelector('.post-col--left');
        const rightCol = document.querySelector('.post-col--right');

        if (leftCol && rightCol) {
          const items = Array.from(document.querySelectorAll('.post-card'));
          const toScore = (el) => {
            const s = (el.dataset.postDate || '').trim();
            // Date.parse("YYYY-MM-DD") is broadly supported.
            const t = Date.parse(s);
            return Number.isFinite(t) ? t : -Infinity;
          };

          items.sort((a, b) => toScore(b) - toScore(a));

          const splitIndex = Math.ceil(items.length / 2);
          items.forEach((el, idx) => {
            (idx < splitIndex ? leftCol : rightCol).appendChild(el);
          });
        }
      })();
    </script>
